name: Check Kyivstar number

on:
  schedule:
    # 07:00 UTC  -> 10:00 Kyiv (summer) / 09:00 Kyiv (winter)
    - cron: "0 7 * * *"

    # 13:00 UTC -> 16:00 Kyiv (summer) / 15:00 Kyiv (winter)
    - cron: "0 13 * * *"

    # 19:00 UTC -> 22:00 Kyiv (summer) / 21:00 Kyiv (winter)
    - cron: "0 19 * * *"

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run checker
        run: node check.js
        env:
          TARGET_NUMBER: ${{ secrets.TARGET_NUMBER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}